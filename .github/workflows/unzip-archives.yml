name: Safe ZIP Extractor

on:
  push:
    branches:
      - feature/threejs-sfs-module-1
    paths:
      - "incoming/**/*.zip"
      - "incoming/*.zip"
  workflow_dispatch:
    inputs:
      archive_path:
        description: "要解压的 ZIP 路径（必须位于 incoming/）"
        required: false
        type: string
        default: "incoming/spaceflight-simulator-i18n.zip"

# This workflow is intentionally restricted to the feature branch.
# It never checks out, commits to, or pushes to main.
permissions:
  contents: write

concurrency:
  group: safe-unzip-feature-threejs-sfs-module-1
  cancel-in-progress: false

jobs:
  extract:
    if: github.ref == 'refs/heads/feature/threejs-sfs-module-1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch only
        uses: actions/checkout@v4
        with:
          ref: feature/threejs-sfs-module-1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract and validate ZIP archives
        env:
          ARCHIVE_PATH: ${{ inputs.archive_path }}
        shell: bash
        run: |
          set -euo pipefail
          # 每次运行使用独立输出目录；重复运行不会覆盖或撞上旧解压目录。
          OUTPUT_DIR="extracted/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$OUTPUT_DIR"

          if [[ -n "${ARCHIVE_PATH:-}" ]]; then
            case "$ARCHIVE_PATH" in
              incoming/*.zip) ;;
              *)
                echo "拒绝处理 incoming/ 以外的 ZIP 路径: $ARCHIVE_PATH" >&2
                exit 1
                ;;
            esac
            if [[ ! -f "$ARCHIVE_PATH" ]]; then
              echo "指定路径不是存在的 ZIP 文件: $ARCHIVE_PATH" >&2
              exit 1
            fi
            python scripts/safe_unzip.py "$ARCHIVE_PATH" --output "$OUTPUT_DIR"
          else
            mapfile -d '' -t FILES < <(find incoming -type f -iname '*.zip' -print0 2>/dev/null || true)
            if (( ${#FILES[@]} == 0 )); then
              echo "incoming/ 中没有找到 ZIP 文件" >&2
              exit 1
            fi
            python scripts/safe_unzip.py "${FILES[@]}" --output "$OUTPUT_DIR"
          fi

          # ZIP 中通常带有一个项目顶层目录；若只有一个目录，就把其内容放到仓库根目录。
          mapfile -d '' TOP_ENTRIES < <(find "$OUTPUT_DIR" -mindepth 1 -maxdepth 1 ! -name 'unzip-report.json' -print0)
          PROJECT_DIR="$OUTPUT_DIR"
          if (( ${#TOP_ENTRIES[@]} == 1 )) && [[ -d "${TOP_ENTRIES[0]}" ]]; then
            PROJECT_DIR="${TOP_ENTRIES[0]}"
          fi

          # 不覆盖仓库中已有文件；同名冲突时明确失败，避免破坏原项目。
          while IFS= read -r -d '' SOURCE_FILE; do
            RELATIVE_PATH="${SOURCE_FILE#"$PROJECT_DIR"/}"
            if [[ -e "$RELATIVE_PATH" ]]; then
              echo "根目录存在同名文件，拒绝覆盖: $RELATIVE_PATH" >&2
              exit 1
            fi
            mkdir -p "$(dirname "$RELATIVE_PATH")"
            cp -p "$SOURCE_FILE" "$RELATIVE_PATH"
            git add -f -- "$RELATIVE_PATH"
          done < <(find "$PROJECT_DIR" -type f -print0)

      - name: Commit extracted files to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f extracted/
          if git diff --cached --quiet; then
            echo "没有新的解压文件需要提交。"
          else
            git commit -m "Extract uploaded ZIP archive"
            git push origin "HEAD:refs/heads/feature/threejs-sfs-module-1"
          fi

      - name: Upload extraction report
        uses: actions/upload-artifact@v4
        with:
          name: unzip-report-${{ github.run_number }}
          path: extracted/run-*/unzip-report.json
          if-no-files-found: error
          retention-days: 14
