name: Safe ZIP Extractor

on:
  push:
    branches:
      - feature/threejs-sfs-module-1
    paths:
      - "incoming/**/*.zip"
      - "incoming/*.zip"
      - ".github/workflows/unzip-archives.yml"
  workflow_dispatch:
    inputs:
      archive_path:
        description: "要解压的 ZIP 路径"
        required: false
        type: string
        default: "incoming/spaceflight-simulator-i18n.zip"

permissions:
  contents: write

concurrency:
  group: safe-unzip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract and validate ZIP archives
        env:
          ARCHIVE_PATH: ${{ inputs.archive_path }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ARCHIVE_PATH:-}" ]]; then
            if [[ "$ARCHIVE_PATH" != *.zip || ! -f "$ARCHIVE_PATH" ]]; then
              echo "指定路径不是存在的 ZIP 文件: $ARCHIVE_PATH" >&2
              exit 1
            fi
            python scripts/safe_unzip.py "$ARCHIVE_PATH" --output extracted
          else
            mapfile -d '' -t FILES < <(find incoming -type f -iname '*.zip' -print0 2>/dev/null || true)
            if (( ${#FILES[@]} == 0 )); then
              echo "incoming/ 中没有找到 ZIP 文件" >&2
              exit 1
            fi
            python scripts/safe_unzip.py "${FILES[@]}" --output extracted
          fi

      - name: Commit extracted files back to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted/
          if git diff --cached --quiet; then
            echo "没有新的解压文件需要提交。"
          else
            git commit -m "Extract uploaded ZIP archive"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload extraction report
        uses: actions/upload-artifact@v4
        with:
          name: unzip-report-${{ github.run_number }}
          path: extracted/unzip-report.json
          if-no-files-found: error
          retention-days: 14
