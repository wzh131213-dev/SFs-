name: Safe ZIP Extractor

on:
  push:
    branches:
      - feature/threejs-sfs-module-1
    paths:
      - "incoming/**/*.zip"
      - "incoming/*.zip"
      - "scripts/safe_unzip.py"
      - ".github/workflows/unzip-archives.yml"
  workflow_dispatch:
    inputs:
      archive_path:
        description: "仓库内 ZIP 文件路径；留空则处理 incoming/ 下所有 ZIP"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: safe-unzip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find and validate ZIP archives
        id: archives
        shell: bash
        run: |
          set -euo pipefail
          INPUT_PATH="${{ inputs.archive_path }}"
          if [[ -n "$INPUT_PATH" ]]; then
            if [[ "$INPUT_PATH" != *.zip ]]; then
              echo "指定文件必须以 .zip 结尾" >&2
              exit 1
            fi
            if [[ ! -f "$INPUT_PATH" ]]; then
              echo "找不到文件: $INPUT_PATH" >&2
              exit 1
            fi
            printf 'archives=%s\n' "$INPUT_PATH" >> "$GITHUB_OUTPUT"
          else
            mapfile -t FILES < <(find incoming -type f -iname '*.zip' -print 2>/dev/null | sort || true)
            if (( ${#FILES[@]} == 0 )); then
              echo "incoming/ 中没有找到 ZIP 文件" >&2
              exit 1
            fi
            {
              echo "archives<<EOF"
              printf '%s\n' "${FILES[@]}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Extract safely
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r archive; do
            [[ -z "$archive" ]] && continue
            python scripts/safe_unzip.py "$archive" --output extracted
          done <<< "${{ steps.archives.outputs.archives }}"

      - name: Upload extracted files and report
        uses: actions/upload-artifact@v4
        with:
          name: extracted-archives-${{ github.run_number }}
          path: extracted/
          if-no-files-found: error
          retention-days: 14
