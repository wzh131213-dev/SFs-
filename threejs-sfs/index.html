<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080e18">
  <title>Spaceflight Simulator · 火箭建造中心</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,sans-serif;background:#080e18;color:#e8f0fa}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080e18}body{min-height:100dvh}
    button{font:inherit;color:inherit;border:1px solid #2a405c;background:#13243a;border-radius:9px;padding:9px 12px;cursor:pointer;touch-action:manipulation}
    button:focus-visible{outline:2px solid #ffad55;outline-offset:2px}button:active{transform:translateY(1px)}
    #app{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#0c1727;border-bottom:1px solid #20334c}
    header strong{letter-spacing:.12em;color:#ffad55}header span{color:#91a8c3;font-size:12px}
    #workspace{display:grid;grid-template-columns:210px minmax(0,1fr) 220px;min-height:560px}
    aside{padding:12px;background:#0b1625;border-right:1px solid #1c3049;overflow:auto}
    #inspector{border-right:0;border-left:1px solid #1c3049}
    h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8ea7c5;margin:3px 0 12px}
    #parts{display:grid;gap:8px}.part-card{display:flex;align-items:center;gap:9px;text-align:left;width:100%;padding:10px;background:#101f33}
    .swatch{width:26px;height:34px;border-radius:5px;border:1px solid #ffffff33;flex:none}
    .part-card small{display:block;color:#8ea7c5;font-size:11px;margin-top:3px}.part-card.selected{border-color:#ffad55;background:#2b2730}
    #stage-wrap{position:relative;min-width:0;min-height:560px;background:radial-gradient(ellipse at 50% 40%,#10223a,#080e18 72%);overflow:hidden}
    #stage{position:absolute;inset:0;touch-action:none}#stage canvas{display:block;width:100%;height:100%;touch-action:none}
    #stage-help{position:absolute;left:14px;top:12px;pointer-events:none;color:#9bb0c9;font-size:12px;background:#07111dcc;padding:7px 10px;border-radius:7px}
    #toolbar{display:flex;gap:7px;flex-wrap:wrap;padding:10px 12px;background:#0c1727;border-top:1px solid #20334c}
    #toolbar button.primary{background:#8c4c1c;border-color:#c67b3e}#toolbar button.danger{background:#351d27;border-color:#6b3444}
    .metric{padding:10px 0;border-bottom:1px solid #1c3049}.metric label{display:block;color:#829ab8;font-size:11px}.metric strong{display:block;margin-top:4px;font-size:17px;font-variant-numeric:tabular-nums}
    #selection{font-size:12px;color:#a7bad1;line-height:1.6;min-height:42px}
    #validation{font-size:12px;line-height:1.55;color:#ffbd75;margin-top:12px;white-space:pre-wrap}
    footer{padding:9px 14px;background:#0c1727;border-top:1px solid #20334c;color:#91cfff;font-size:12px;min-height:34px}
    #file-input{display:none}
    @media(max-width:850px){#workspace{grid-template-columns:150px minmax(0,1fr);grid-template-rows:minmax(440px,1fr) auto}#inspector{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;border-left:0;border-top:1px solid #1c3049}#inspector h2{grid-column:1/-1}#stage-wrap{min-height:480px}aside{padding:9px}.part-card{padding:8px;gap:6px}}
    @media(max-width:560px){header{align-items:flex-start;flex-direction:column;gap:4px}#workspace{grid-template-columns:112px minmax(0,1fr);grid-template-rows:minmax(420px,1fr) auto}#stage-wrap{min-height:420px}aside{padding:7px}.part-card{font-size:11px;display:block;text-align:center}.swatch{display:block;margin:0 auto 5px;width:20px;height:25px}.part-card small{font-size:10px}#inspector{grid-template-columns:repeat(2,minmax(0,1fr));padding:9px}.metric strong{font-size:15px}#toolbar{gap:6px;padding:8px}#toolbar button{font-size:12px;padding:8px 9px}}
  </style>
</head>
<body>
<main id="app">
  <header><div><strong>SFS / VAB</strong> <span>— THREE.JS ROCKET ASSEMBLY</span></div><span>MODULE 2 · 火箭建造系统</span></header>
  <section id="workspace">
    <aside aria-label="零件托盘"><h2>零件库 / PARTS</h2><div id="parts"></div></aside>
    <section id="stage-wrap" aria-label="火箭建造画布">
      <div id="stage"></div><div id="stage-help">拖动左侧零件到画布放置 · 点击零件选择 · 旋转 / 删除</div>
    </section>
    <aside id="inspector" aria-label="火箭属性">
      <h2>火箭数据 / TELEMETRY</h2>
      <div class="metric"><label>总质量 TOTAL</label><strong id="total-mass">0.00 kg</strong></div>
      <div class="metric"><label>干质量 DRY</label><strong id="dry-mass">0.00 kg</strong></div>
      <div class="metric"><label>推进剂 PROPELLANT</label><strong id="fuel-mass">0.00 kg</strong></div>
      <div class="metric"><label>质心 CENTER OF MASS</label><strong id="com">(0.00, 0.00)</strong></div>
      <div class="metric"><label>已安装零件 PARTS</label><strong id="part-count">0</strong></div>
      <h2>当前选择 / SELECTION</h2><div id="selection">尚未选择零件</div>
      <div id="validation" role="status" aria-live="polite"></div>
    </aside>
  </section>
  <nav id="toolbar" aria-label="建造工具">
    <button id="rotate">↻ 旋转 90°</button><button id="delete" class="danger">删除零件</button>
    <button id="save" class="primary">保存蓝图 JSON</button><button id="load">加载蓝图</button>
    <button id="clear">清空火箭</button><input id="file-input" type="file" accept="application/json,.json">
  </nav>
  <footer id="status">正在初始化 VAB…</footer>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
